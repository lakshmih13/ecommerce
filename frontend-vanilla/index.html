<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Codveda Product Catalog</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Codveda Product Catalog</h1>
    <p>Level 1 — vanilla JS frontend consuming the Express/PostgreSQL REST API</p>
  </header>

  <main>
    <section class="form-section">
      <h2 id="form-title">Add Product</h2>
      <form id="product-form">
        <input type="hidden" id="product-id" />
        <input type="text" id="name" placeholder="Name" required />
        <input type="text" id="category" placeholder="Category" />
        <input type="number" id="price" placeholder="Price" step="0.01" min="0" required />
        <input type="number" id="stock" placeholder="Stock" min="0" />
        <textarea id="description" placeholder="Description"></textarea>
        <div class="form-buttons">
          <button type="submit" id="submit-btn">Add Product</button>
          <button type="button" id="cancel-btn" class="hidden">Cancel</button>
        </div>
      </form>
    </section>

    <section class="catalog-section">
      <h2>Products</h2>
      <div id="status"></div>
      <div id="product-grid" class="product-grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
